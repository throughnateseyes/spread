<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- macOS app icon. Apple grid: 824×824 body at (100,100), corner radius 185, soft drop shadow in the margin.
       Rasterized by scripts/build-icon.mjs into icon.png / icon.icns. -->
  <defs>
    <linearGradient id="body" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b2b30"/>
      <stop offset="1" stop-color="#131315"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".02"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope=".32"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)" filter="url(#shadow)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="url(#rim)" stroke-width="2"/>
  <!-- the mark (64-unit grid) at 540px -->
  <g transform="translate(242 242) scale(8.4375)">
    <path fill="#0d99ff" d="M12 6H28a2 2 0 0 1 2 2V56a2 2 0 0 1-2 2H12a8 8 0 0 1-8-8V14a8 8 0 0 1 8-8Z"/>
    <path fill="#9747ff" d="M36 6H52a8 8 0 0 1 8 8V50a8 8 0 0 1-8 8H36a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z"/>
    <path fill="#fff" d="M30 17.134A15 15 0 1 0 30 46.866Z"/>
    <path fill="#fff" d="M34 17.134A15 15 0 1 1 34 46.866Z"/>
  </g>
</svg>
